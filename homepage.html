    <script>
        // Select the footer element
        const footer = document.querySelector('#page-footer');

        // Configure the observer
        const options = {
            root: null, // Uses the browser viewport
            rootMargin: '0px 0px 150px 0px', // Triggers 150px BEFORE the footer enters the viewport
            threshold: 0 // Triggers as soon as the bounding margin is crossed
        };

        // Callback function when intersection occurs
        const observerCallback = (entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    console.log('Approaching footer! Triggering action...');
                    
                    // Place your custom code here (e.g., stop sticky bars, load items, etc.)
                    document.body.style.backgroundColor = '#fff9c4'; 

                    // Optional: Unobserve if you only want it to happen once
                    // observer.unobserve(entry.target);
                } else {
                    // Reset when scrolling back up away from the footer
                    document.body.style.backgroundColor = '';
                }
            });
        };

        // Initialize and start observing
        const observer = new IntersectionObserver(observerCallback, options);
        observer.observe(footer);
    </script>
