<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="styleRegistration.css">
   
</head>
<body>
    <main class="registration-page">
        <header class="registration-header">
            <a class="logo" href="homepage.html" style="text-decoration:none;">LOGO</a>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="homepage.html">Home</a></li>
                    <li><a href="About.html">About</a></li>
                    <li><a href="Details.html">Details</a></li>
                    <li><a href="Contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>

        <section class="registration-card" aria-labelledby="registration-title">
            <h1 id="registration-title">Create an Account</h1>
            <p class="registration-intro">Register below to get started.</p>

            <form class="registration-form" id="registrationForm">
                <label for="fullName">Full name</label>
                <input id="fullName" name="fullName" type="text" autocomplete="name"
                       placeholder="Enter your full name" required>

                <label for="email">Email address</label>
                <input id="email" name="email" type="email" autocomplete="email"
                       placeholder="Enter your email address" required>

                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       minlength="3" placeholder="Choose a username" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password"
                       minlength="8" placeholder="At least 8 characters" required>

                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" name="confirmPassword" type="password"
                       autocomplete="new-password" minlength="8"
                       placeholder="Enter your password again" required>

                <label class="terms">
                    <input id="terms" name="terms" type="checkbox" required>
                    <span>I agree to the terms and conditions.</span>
                </label>

                <button class="registration-submit" type="submit">Create Account</button>
                <p class="registration-login">Already have an account? <a href="Login.html">Log in</a></p>
                <div class="registration-message" id="registrationMessage" role="status"></div>
            </form>
        </section>
    </main>

    <script>
        const form = document.getElementById('registrationForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const message = document.getElementById('registrationMessage');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            message.style.display = 'block';

            if (password.value !== confirmPassword.value) {
                message.textContent = 'Your passwords do not match. Please check and try again.';
                message.style.borderColor = '#ff8a80';
                message.style.background = 'rgba(180, 35, 24, 0.22)';
                confirmPassword.focus();
                return;
            }

            message.textContent = 'The form looks good! Registration is currently a front-end demo; connect it to a backend to create and save accounts.';
            message.style.borderColor = '#73d69a';
            message.style.background = 'rgba(42, 150, 75, 0.22)';
        });
    </script>
</body>
</html>
